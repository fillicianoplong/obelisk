name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Typecheck, lint, test, coverage
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Electron 45 has no postinstall, so npm ci does not download the binary.
      # npm test installs it once before any test process. This step is that
      # same install, so the download finishes before the test step. It is not
      # a retry, and the test step is not retried.
      - name: Install Electron
        run: node node_modules/electron/install.js

      - name: Test and coverage
        run: npm test

      - name: Scale and smallest window
        run: node tests/visual/scale-window.mjs

      - name: Upload scale screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scale-screenshots
          path: tests/visual/output/*.png
          if-no-files-found: warn

  dev-msix:
    name: Dev MSIX
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm

      - name: Install
        run: npm ci

      - name: Package the dev MSIX twice
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-Thumbprint([string] $Log) {
            $match = Select-String -LiteralPath $Log -Pattern 'Dev certificate thumbprint: ([0-9A-F]{40})' | Select-Object -Last 1
            if (-not $match) {
              throw "package:msix did not print a certificate thumbprint ($Log)."
            }
            return $match.Matches[0].Groups[1].Value
          }
          cmd /c "npm run package:msix > package-1.log 2>&1"
          if ($LASTEXITCODE -ne 0) {
            Get-Content -LiteralPath package-1.log
            exit $(if ($LASTEXITCODE) { $LASTEXITCODE } else { 1 })
          }
          Get-Content -LiteralPath package-1.log
          $first = Get-Thumbprint 'package-1.log'
          cmd /c "npm run package:msix > package-2.log 2>&1"
          if ($LASTEXITCODE -ne 0) {
            Get-Content -LiteralPath package-2.log
            exit $(if ($LASTEXITCODE) { $LASTEXITCODE } else { 1 })
          }
          Get-Content -LiteralPath package-2.log
          $second = Get-Thumbprint 'package-2.log'
          if ($first -ne $second) {
            throw "Dev certificate thumbprints differ: $first and $second."
          }
          if (-not (Select-String -LiteralPath package-2.log -Pattern 'Dev certificate: reused' -Quiet)) {
            throw "The second package:msix run did not reuse the dev certificate."
          }
          Write-Output "package run 1 thumbprint: $first"
          Write-Output "package run 2 thumbprint: $second"
          Write-Output "OBELISK_DEV_CERT_THUMBPRINT $first"

      - name: Check Electron fuses
        run: npm run check:fuses -- dist/msix/Obelisk-Dev.msix

      - name: Install, launch, and remove
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/smoke-msix.ps1 -Msix dist/msix/Obelisk-Dev.msix -Certificate dist/msix/obelisk-dev.cer

      - name: Upload the dev MSIX and certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: obelisk-dev-msix
          path: |
            dist/msix/Obelisk-Dev.msix
            dist/msix/obelisk-dev.cer
          if-no-files-found: warn
