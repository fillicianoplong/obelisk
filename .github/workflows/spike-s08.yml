name: Spike S-08

on:
  push:
    branches: [main]
    paths:
      - 'spikes/**'
      - '.github/workflows/spike-s08.yml'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'spikes/**'
      - '.github/workflows/spike-s08.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: spike-s08-${{ github.ref }}
  cancel-in-progress: false

jobs:
  decode:
    name: Node and utilityProcess (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm

      - name: Install the app
        run: npm ci

      # Electron 45 has no postinstall. The spike launches this binary.
      - name: Install Electron
        run: node node_modules/electron/install.js

      - name: Install the spike
        working-directory: spikes/s08
        run: npm ci

      - name: Typecheck the spike
        working-directory: spikes/s08
        run: npm run typecheck

      # Electron on the Ubuntu runner needs a display. The setuid sandbox helper
      # on that image is not configured, and the spike records the --no-sandbox
      # retry when that happens. Windows starts Electron directly.
      - name: Run the spike
        if: runner.os == 'Windows'
        working-directory: spikes/s08
        run: npm start

      - name: Run the spike
        if: runner.os == 'Linux'
        working-directory: spikes/s08
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
          xvfb-run --auto-servernum npm start

      - name: Upload the spike report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s08-report-${{ matrix.os }}
          path: spikes/s08/output/
          if-no-files-found: warn
